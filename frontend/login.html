<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - API Security Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #667eea; --secondary: #764ba2; --danger: #ef4444; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: #fff;
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 26px;
        }
        .brand h1 { font-size: 20px; font-weight: 800; color: #1e1b4b; margin-bottom: 4px; }
        .brand p  { font-size: 13px; color: #6b7280; }
        .hint {
            background: rgba(102,126,234,.06);
            border: 1px solid rgba(102,126,234,.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 20px;
        }
        .hint span { font-weight: 700; color: var(--primary); }
        .error {
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.3);
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .fg { margin-bottom: 18px; }
        .fg label { display: block; font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
        .fg input {
            width: 100%; padding: 12px 14px;
            border: 2px solid #e5e7eb; border-radius: 10px;
            font-size: 14px; font-family: 'Inter', sans-serif;
            color: #1e1b4b; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .fg input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,.12); }
        .fg input::placeholder { color: #9ca3af; }
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all .2s; margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,.4); }
        .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .footer { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 28px; border-top: 1px solid #f3f4f6; padding-top: 24px; }
        .footer strong { color: #6b7280; }
        .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="box">
    <div class="brand">
        <div class="brand-icon">&#128274;</div>
        <h1>API Security Tester</h1>
        <p>Sign in to access your dashboard</p>
    </div>

    <div class="hint">
        Default login &mdash; Username: <span>admin</span> &nbsp;|&nbsp; Password: <span>admin123</span>
    </div>

    <div class="error" id="errMsg"></div>

    <div class="fg">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
    </div>
    <div class="fg">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>

    <div class="footer">
        <strong>Samriddhi Poudel</strong> (23047345)<br>
        Final Year Project 2025 &mdash; London Metropolitan University
    </div>
</div>

<script>
var API = 'http://127.0.0.1:8000';

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
});

function doLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var btn      = document.getElementById('loginBtn');
    var err      = document.getElementById('errMsg');

    err.style.display = 'none';

    if (!username || !password) {
        err.textContent   = 'Please enter both username and password.';
        err.style.display = 'block';
        return;
    }

    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in...';

    fetch(API + '/api/auth/login', {
        method:      'POST',
        credentials: 'include',
        headers:     { 'Content-Type': 'application/json' },
        body:        JSON.stringify({ username: username, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.success || d.authenticated) {
            window.location.href = 'dashboard.html';
        } else {
            err.textContent   = d.message || 'Invalid username or password.';
            err.style.display = 'block';
            btn.disabled      = false;
            btn.innerHTML     = 'Sign In';
        }
    })
    .catch(function() {
        // Auth not configured — go straight to dashboard
        window.location.href = 'dashboard.html';
    });
}
</script>
</body>
</html>
